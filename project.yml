name: FestiveLights
options:
  bundleIdPrefix: ms.blckbox
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "$(ARCHS_STANDARD)"
targets:
  FestiveLights:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: ["Resources/Info.plist"]
      - path: Art
        includes: ["*.pdf"]
        excludes: ["menubar-icon.pdf"]
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleName: FestiveLights
        CFBundleDisplayName: FestiveLights
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        NSHumanReadableCopyright: "Blackbox Innovation GmbH"
        CFBundleIconName: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ms.blckbox.FestiveLights
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Resources/Info.plist
  FestiveLightsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Sources/Logic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ms.blckbox.FestiveLightsTests
schemes:
  FestiveLights:
    build:
      targets:
        FestiveLights: all
        FestiveLightsTests: [test]
    test:
      targets: [FestiveLightsTests]
