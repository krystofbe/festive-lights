name: FestiveLights
configs:
  Debug: debug
  Release: release
  Test: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
  Test: Config/Base.xcconfig

options:
  bundleIdPrefix: ms.blckbox
  deploymentTarget:
    macOS: "14.0"
settings:
  configs:
    Test:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "$(ARCHS_STANDARD)"
targets:
  FestiveLights:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: ["Resources/Info.plist", "Resources/FestiveLights.entitlements"]
      - path: Art
        includes: ["*.pdf"]
        excludes: ["menubar-icon.pdf"]
      - path: Art/Tanne
        includes: ["*.pdf", "fir-*.png"]
        excludes: ["bauble-*.pdf"]
      - path: Art/TanneBunt
        includes: ["*.pdf"]
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleName: FestiveLights
        CFBundleDisplayName: FestiveLights
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        NSHumanReadableCopyright: "Copyright © 2026 Blackbox Innovation GmbH"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ms.blckbox.FestiveLights
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/FestiveLights.entitlements
  FestiveLightsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Sources/Logic
      - path: Sources/Settings.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ms.blckbox.FestiveLightsTests
schemes:
  FestiveLights:
    build:
      targets:
        FestiveLights: all
        FestiveLightsTests: [test]
    test:
      targets: [FestiveLightsTests]
